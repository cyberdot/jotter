name: Build and Test

# Runs on every branch push (this also covers a PR being merged, since merging
# updates the base branch and triggers a push event) and on every PR being
# opened or updated.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jotter.slnx

      - name: Build
        run: dotnet build Jotter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Jotter.slnx --configuration Release --no-build
