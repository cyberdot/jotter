name: Build and Test

# Manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jotter.slnx

      - name: Build
        run: dotnet build Jotter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Jotter.slnx --configuration Release --no-build
