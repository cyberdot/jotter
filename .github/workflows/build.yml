name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jotter.slnx

      - name: Build
        run: dotnet build Jotter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Jotter.slnx --configuration Release --no-build

      - name: Pack .NET tool
        run: dotnet pack src/Jotter.Console/Jotter.Console.fsproj --configuration Release --no-build --output artifacts
